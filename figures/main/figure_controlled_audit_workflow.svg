<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1320" viewBox="0 0 2400 1320"><rect width="2400" height="1320" fill="#ffffff"/><style>
text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
.title { font-size: 40px; font-weight: 700; }
.body { font-size: 30px; }
.small { font-size: 26px; }
.lane { font-size: 30px; font-weight: 700; fill: #5f6368; }
</style><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12.5" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#5f6368"/></marker></defs><text class="lane" x="55" y="70">CONTROLLED CANDIDATE-SET EVALUATION</text><rect x="80" y="105" width="2240" height="205" rx="24" fill="#eef4fb" stroke="#1f4e79" stroke-width="4"/><text class="title" x="1200" y="161" text-anchor="middle">1. Freeze the temporal reference</text><text class="body" x="1200" y="210" text-anchor="middle">Queries and cutoffs  •  eligible catalog  •  logged relevance  •  prior-pair exclusions</text><text class="body" x="1200" y="250" text-anchor="middle">Fixed model configurations, scores, tie rule, metrics, cutoffs, cohort, and weights</text><line x1="1200" y1="310" x2="1200" y2="375" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><rect x="95" y="390" width="920" height="210" rx="24" fill="#eef8f5" stroke="#2a9d8f" stroke-width="4"/><text class="title" x="555" y="446" text-anchor="middle">2A. Sampling-free reference</text><text class="body" x="555" y="495" text-anchor="middle">Rank every temporally eligible job</text><text class="body" x="555" y="535" text-anchor="middle">Sampling-free logged-catalog estimate</text><rect x="1385" y="390" width="920" height="210" rx="24" fill="#fff4ea" stroke="#d95f02" stroke-width="4"/><text class="title" x="1845" y="446" text-anchor="middle">2B. Candidate intervention</text><text class="body" x="1845" y="495" text-anchor="middle">Retain every eligible relevant job</text><text class="body" x="1845" y="535" text-anchor="middle">Sample negatives without replacement</text><text class="body" x="1845" y="575" text-anchor="middle">Uniform or popularity weighted; nested sizes; five seeds</text><line x1="1015" y1="495" x2="1040" y2="495" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><line x1="1385" y1="495" x2="1360" y2="495" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><rect x="1050" y="390" width="300" height="210" rx="24" fill="#f5f7fa" stroke="#5f6368" stroke-width="4"/><text class="title" x="1200" y="446" text-anchor="middle">Common basis</text><text class="body" x="1200" y="495" text-anchor="middle">same query</text><text class="body" x="1200" y="535" text-anchor="middle">same score vector</text><text class="body" x="1200" y="575" text-anchor="middle">same metric code</text><line x1="1200" y1="600" x2="1200" y2="675" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><rect x="70" y="700" width="690" height="245" rx="24" fill="#f5f7fa" stroke="#5f6368" stroke-width="4"/><text class="title" x="415" y="756" text-anchor="middle">3. Metric distortion</text><text class="body" x="415" y="805" text-anchor="middle">Signed and absolute bias</text><text class="body" x="415" y="845" text-anchor="middle">Candidate fraction and convergence</text><text class="body" x="415" y="885" text-anchor="middle">Seed variability</text><rect x="855" y="700" width="690" height="245" rx="24" fill="#f5f7fa" stroke="#5f6368" stroke-width="4"/><text class="title" x="1200" y="756" text-anchor="middle">4. Model-comparison agreement</text><text class="body" x="1200" y="805" text-anchor="middle">Paired-effect distortion and reversal</text><text class="body" x="1200" y="845" text-anchor="middle">Kendall tau-b and pairwise agreement</text><text class="body" x="1200" y="885" text-anchor="middle">Top-model agreement and reference regret</text><rect x="1640" y="700" width="690" height="245" rx="24" fill="#f5f7fa" stroke="#5f6368" stroke-width="4"/><text class="title" x="1985" y="756" text-anchor="middle">5. Variation and uncertainty</text><text class="body" x="1985" y="805" text-anchor="middle">Window/date-aware paired bootstrap</text><text class="body" x="1985" y="845" text-anchor="middle">Temporal and descriptive subgroups</text><text class="body" x="1985" y="885" text-anchor="middle">Eligibility and horizon sensitivities</text><line x1="1200" y1="600" x2="415" y2="680" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><line x1="1200" y1="600" x2="1200" y2="680" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><line x1="1200" y1="600" x2="1985" y2="680" stroke="#5f6368" stroke-width="7" marker-end="url(#arrow)"/><line x1="50" y1="1015" x2="2350" y2="1015" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="18 12"/><text class="lane" x="55" y="1070">SEPARATE COMPUTATIONAL EVIDENCE</text><rect x="330" y="1090" width="1740" height="180" rx="24" fill="#fff8e7" stroke="#a36b00" stroke-width="4" stroke-dasharray="16 12"/><text class="title" x="1200" y="1146" text-anchor="middle">6. Direct-scoring benchmark</text><text class="body" x="1200" y="1195" text-anchor="middle">Score only declared sampling-free or sampled candidates; then rank and calculate metrics</text><text class="body" x="1200" y="1235" text-anchor="middle">Report pair counts and measured scope; exclude loading, fitting, encoding, candidate generation, I/O, and energy</text><path d="M2250,600 L2360,600 L2360,1035 L1900,1035 L1900,1070" fill="none" stroke="#5f6368" stroke-width="7" stroke-dasharray="15 12" marker-end="url(#arrow)"/></svg>